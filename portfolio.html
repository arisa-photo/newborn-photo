<body>

  <main>
    <div class="page-head container"><a class="backlink" href="index.html">トップに戻る</a><div style="margin-top:18px"><span class="eyebrow">Portfolio</span><h1>ポートフォリオ</h1><p>これまでの撮影を、ジャンルごとにまとめました。写真の雰囲気や残せるイメージをご確認いただけます。</p></div></div>

    <section><div class="container">
      <div class="pf-tabs" id="pfTabs">
        <button type="button" class="pf-tab is-active" data-genre="">すべて</button>
        <button type="button" class="pf-tab" data-genre="ニューボーン">ニューボーン</button>
        <button type="button" class="pf-tab" data-genre="マタニティ">マタニティ</button>
        <button type="button" class="pf-tab" data-genre="お宮参り">お宮参り</button>
        <button type="button" class="pf-tab" data-genre="アニバーサリー">アニバーサリー</button>
      </div>
      <div class="portfolio-grid" id="pfGrid"><p class="pf-loading">読み込み中…</p></div>
    </div></section>
    <script>
    (function () {
      var GAS = "https://script.google.com/macros/s/AKfycbwyTGqFWYDZLqw2m48hkjLvagRh1kB7Pk2BoDJzQa9OkiJ6UAC_roNF7JlDokYa-M5xpw/exec";
      var grid = document.getElementById("pfGrid");
      var tabs = document.getElementById("pfTabs");
      var all = [], cur = "", loaded = false;
      var SUB_ORDER = ["ロケーション", "ミルクバス", "フラワー", "フォトブース"];
      function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
      function itemsHtml(list){
        return list.map(function(p){
          return '<div class="portfolio-item"><img loading="lazy" src="'+esc(p.url)+'" alt="'+esc(p.title||"作品")+'"></div>';
        }).join("");
      }
      function render(){
        var list = cur ? all.filter(function(p){ return p.genre === cur; }) : all;
        if(!list.length){ grid.classList.remove("pf-grouped"); grid.innerHTML = '<p class="pf-loading">この分類の写真は準備中です。</p>'; return; }
        if(cur === "アニバーサリー"){
          grid.classList.add("pf-grouped");
          var groups = SUB_ORDER.slice();
          list.forEach(function(p){ var s = p.sub || "その他"; if(groups.indexOf(s) < 0) groups.push(s); });
          var html = "";
          groups.forEach(function(name){
            var g = list.filter(function(p){ return (p.sub || "その他") === name; });
            if(!g.length) return;
            html += '<div class="pf-group"><h3 class="pf-subhead">'+esc(name)+'</h3><div class="portfolio-grid">'+itemsHtml(g)+'</div></div>';
          });
          grid.innerHTML = html;
          return;
        }
        grid.classList.remove("pf-grouped");
        grid.innerHTML = itemsHtml(list);
      }
      window.__onPortfolio = function(res){
        loaded = true;
        if(!res || !res.ok || !res.photos || !res.photos.length){ grid.innerHTML = '<p class="pf-loading">写真を準備中です。</p>'; return; }
        all = res.photos; render();
      };
      tabs.addEventListener("click", function(e){
        var b = e.target.closest(".pf-tab"); if(!b) return;
        cur = b.getAttribute("data-genre");
        [].forEach.call(tabs.children, function(x){ x.classList.toggle("is-active", x === b); });
        render();
      });
      var s = document.createElement("script");
      s.src = GAS + "?action=portfolio&callback=__onPortfolio";
      s.onerror = function(){ grid.innerHTML = '<p class="pf-loading">写真の読み込みに失敗しました。時間をおいて再度お試しください。</p>'; };
      document.body.appendChild(s);
      setTimeout(function(){ if(!loaded){ grid.innerHTML = '<p class="pf-loading">写真の読み込みに時間がかかっています。ページを更新してみてください。</p>'; } }, 15000);
    })();
    </script>

    <section id="contact" class="cta"><div class="narrow"><span class="eyebrow">Contact</span><p><span class="wbr">日程・場所・ご希望のプランが</span><span class="wbr">決まっていなくても大丈夫です。</span><br><span class="wbr">まずは、残したい内容やご希望時期を</span><span class="wbr">お気軽にご相談ください。</span></p><div class="btns" style="justify-content:center"><a class="btn line" href="https://lin.ee/nrPaFDa" target="_blank" rel="noreferrer">相談する</a><a class="btn js-book" href="#booking">予約する</a></div><a class="ig-link" href="https://www.instagram.com/arisa_newbornphoto/" target="_blank" rel="noreferrer" aria-label="Instagramを見る"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.05" fill="currentColor" stroke="none"/></svg></a></div></section>
