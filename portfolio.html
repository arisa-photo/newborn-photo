<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ポートフォリオ｜arisa newborn photo</title>
  <link rel="stylesheet" href="style.css?v=111" />
  <style>
    .portfolio-item img{cursor:zoom-in}
    .pf-lightbox{position:fixed;inset:0;background:rgba(30,26,22,.9);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000;opacity:0;transition:opacity .25s ease}
    .pf-lightbox[hidden]{display:none}
    .pf-lightbox.is-open{opacity:1}
    .pf-lightbox img{max-width:92vw;max-height:88vh;width:auto;height:auto;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .pf-lightbox .pf-close{position:absolute;top:16px;right:20px;width:42px;height:42px;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:26px;line-height:1;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
    @media(hover:hover){.pf-lightbox .pf-close:hover{background:rgba(255,255,255,.28)}}
  </style>
</head>
<body>
  <header class="nav"><div class="container nav-inner"><div class="brand"><a href="index.html">arisa newborn photo</a></div><input id="nav-toggle" class="nav-checkbox" type="checkbox" /><label class="nav-toggle" for="nav-toggle" aria-label="メニューを開閉"><span></span><span></span><span></span></label><nav class="nav-links"><a href="index.html">Home</a><a href="index.html#service">Menu</a><a href="photogoods.html">Goods</a><a href="portfolio.html">Portfolio</a><a href="profile.html">Profile</a><a href="index.html#contact">Contact</a></nav></div></header>
  <main>
    <div class="page-head container"><a class="backlink" href="index.html">トップに戻る</a><div style="margin-top:18px"><span class="eyebrow">Portfolio</span><h1>ポートフォリオ</h1><p>これまでの撮影を、ジャンルごとにまとめました。<br>写真の雰囲気や残せるイメージをご確認いただけます。</p></div></div>

    <section><div class="container">
      <div class="pf-tabs" id="pfTabs">
        <button type="button" class="pf-tab is-active" data-genre="">すべて</button>
        <button type="button" class="pf-tab" data-genre="ニューボーン">ニューボーン</button>
        <button type="button" class="pf-tab" data-genre="マタニティ">マタニティ</button>
        <button type="button" class="pf-tab" data-genre="お宮参り">お宮参り</button>
        <button type="button" class="pf-tab" data-genre="アニバーサリー">アニバーサリー</button>
      </div>
      <div class="portfolio-grid" id="pfGrid"><p class="pf-loading">読み込み中…</p></div>
    </div></section>
    <div id="pfLightbox" class="pf-lightbox" hidden><button type="button" class="pf-close" aria-label="閉じる">×</button><img src="" alt=""></div>
    <script>
    (function () {
      var GAS = "https://script.google.com/macros/s/AKfycbwyTGqFWYDZLqw2m48hkjLvagRh1kB7Pk2BoDJzQa9OkiJ6UAC_roNF7JlDokYa-M5xpw/exec";
      var grid = document.getElementById("pfGrid");
      var tabs = document.getElementById("pfTabs");
      var all = [], cur = "", loaded = false;
      var SUB_ORDER = ["ロケーション", "フォトブース", "フラワー", "ミルクバス"];
      var SUB_LABEL = { "フラワー": "フラワーフォトブース" };
      var GENRE_ORDER = ["ニューボーン", "マタニティ", "お宮参り", "アニバーサリー"];
      function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
      function itemsHtml(list){
        return list.map(function(p){
          return '<div class="portfolio-item"><img loading="lazy" src="'+esc(p.url)+'" alt="'+esc(p.title||"作品")+'"></div>';
        }).join("");
      }
      function orderedAll(){
        // 「すべて」はジャンルのまとまり順に。各ジャンル内はGAS(並び順)の順を維持
        var out = [];
        GENRE_ORDER.forEach(function(g){ out = out.concat(all.filter(function(p){ return p.genre === g; })); });
        all.forEach(function(p){ if(GENRE_ORDER.indexOf(p.genre) < 0) out.push(p); });
        return out;
      }
      function render(){
        var list = cur ? all.filter(function(p){ return p.genre === cur; }) : orderedAll();
        if(!list.length){ grid.classList.remove("pf-grouped"); grid.innerHTML = '<p class="pf-loading">この分類の写真は準備中です。</p>'; return; }
        if(cur === "アニバーサリー"){
          grid.classList.add("pf-grouped");
          var groups = SUB_ORDER.slice();
          list.forEach(function(p){ var s = p.sub || "その他"; if(groups.indexOf(s) < 0) groups.push(s); });
          var html = "";
          groups.forEach(function(name){
            var g = list.filter(function(p){ return (p.sub || "その他") === name; });
            if(!g.length) return;
            html += '<div class="pf-group"><h3 class="pf-subhead">'+esc(SUB_LABEL[name] || name)+'</h3><div class="portfolio-grid">'+itemsHtml(g)+'</div></div>';
          });
          grid.innerHTML = html;
          return;
        }
        grid.classList.remove("pf-grouped");
        grid.innerHTML = itemsHtml(list);
      }
      window.__onPortfolio = function(res){
        loaded = true;
        if(!res || !res.ok || !res.photos || !res.photos.length){ grid.innerHTML = '<p class="pf-loading">写真を準備中です。</p>'; return; }
        all = res.photos; render();
      };
      tabs.addEventListener("click", function(e){
        var b = e.target.closest(".pf-tab"); if(!b) return;
        cur = b.getAttribute("data-genre");
        [].forEach.call(tabs.children, function(x){ x.classList.toggle("is-active", x === b); });
        render();
      });
      // URLの ?genre=◯◯ で最初に表示するジャンルを選択（各撮影ページの「作例を見る」用）
      (function(){
        var m = /[?&]genre=([^&]+)/.exec(location.search);
        if(!m) return;
        var g = decodeURIComponent(m[1]);
        [].forEach.call(tabs.children, function(x){
          var on = x.getAttribute("data-genre") === g;
          x.classList.toggle("is-active", on);
          if(on) cur = g;
        });
      })();
      // ライトボックス（写真クリックで拡大表示）
      var lb = document.getElementById("pfLightbox");
      var lbImg = lb ? lb.querySelector("img") : null;
      function openLb(src, alt){ if(!lb) return; lbImg.src = src; lbImg.alt = alt || ""; lb.hidden = false; requestAnimationFrame(function(){ lb.classList.add("is-open"); }); document.body.style.overflow = "hidden"; }
      function closeLb(){ if(!lb) return; lb.classList.remove("is-open"); document.body.style.overflow = ""; setTimeout(function(){ lb.hidden = true; lbImg.src = ""; }, 250); }
      grid.addEventListener("click", function(e){ var im = e.target.closest(".portfolio-item img"); if(!im) return; openLb(im.getAttribute("src"), im.getAttribute("alt")); });
      if(lb){ lb.addEventListener("click", function(e){ if(e.target === lb || e.target.classList.contains("pf-close")) closeLb(); }); }
      document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeLb(); });

      var s = document.createElement("script");
      s.src = GAS + "?action=portfolio&callback=__onPortfolio";
      s.onerror = function(){ grid.innerHTML = '<p class="pf-loading">写真の読み込みに失敗しました。時間をおいて再度お試しください。</p>'; };
      document.body.appendChild(s);
      setTimeout(function(){ if(!loaded){ grid.innerHTML = '<p class="pf-loading">写真の読み込みに時間がかかっています。ページを更新してみてください。</p>'; } }, 15000);
    })();
    </script>

    <section id="contact" class="cta"><div class="narrow"><span class="eyebrow">Contact</span><p><span class="wbr">日程・場所・ご希望のプランが</span><span class="wbr">決まっていなくても大丈夫です。</span><br><span class="wbr">まずは、残したい内容やご希望時期を</span><span class="wbr">お気軽にご相談ください。</span></p><div class="btns" style="justify-content:center"><a class="btn line" href="https://lin.ee/nrPaFDa" target="_blank" rel="noreferrer">相談する</a><a class="btn js-book" href="#booking">予約する</a></div><a class="ig-link" href="https://www.instagram.com/arisa_newbornphoto/" target="_blank" rel="noreferrer" aria-label="Instagramを見る"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.05" fill="currentColor" stroke="none"/></svg></a></div></section>
