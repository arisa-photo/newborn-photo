<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ニューボーンフォト料金診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   全体のカラー・タイポグラフィ設定
   （やさしくナチュラルな雰囲気：白 × ベージュ × くすみカラー）
   ========================================================= */
:root {
  --bg: #FBF8F4;            /* 全体の背景（ほんのりベージュ） */
  --surface: #FFFFFF;       /* カードの背景 */
  --surface-soft: #F5EFE7;  /* 選択中の淡いベージュ */
  --border: #E6DED2;        /* ボーダー */
  --text: #4A4642;          /* メインテキスト */
  --text-sub: #8A8178;      /* サブテキスト */
  --accent: #B99A76;        /* アクセント（くすみベージュブラウン） */
  --accent-soft: #EFE3D2;   /* アクセント淡色 */
  --pink-soft: #F4E7E1;     /* 差し色 */
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(74,70,66,.05);
  --radius: 14px;
  --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
}

/* 読み込み中インジケーター */
.spinner {
  display: inline-block;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 2px solid rgba(74,70,66,.18);
  border-top-color: var(--accent);
  animation: spin .7s linear infinite;
  vertical-align: -2px;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* キーボード操作時のフォーカス表示 */
:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.6;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

/* コンテナ（スマホ幅を基準に、PCでも中央寄せ） */
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 24px 16px 28px;
}

/* ヘッダー */
.header {
  text-align: center;
  margin-bottom: 24px;
}
.header .brand {
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--text-sub);
  margin-bottom: 8px;
}
.header h1 {
  font-family: var(--serif);
  font-size: 21px;
  margin: 0 0 8px;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.header p {
  font-size: 13px;
  color: var(--text-sub);
  margin: 0;
}

/* セクション見出し */
.step-label {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 10px;
}
h2 {
  font-family: var(--serif);
  font-size: 17px;
  margin: 0 0 16px;
  font-weight: 600;
}
h3 {
  font-size: 15px;
  margin: 0 0 10px;
  font-weight: 600;
}

/* カード共通 */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

/* 選択肢カード（ジャンル選択、質問の回答など） */
.option {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
  transition: all .15s ease;
  min-height: 48px;
  font-family: inherit;
  line-height: 1.5;
}
.option:hover { border-color: var(--accent); }
.option.selected {
  border-color: var(--accent);
  background: var(--surface-soft);
  box-shadow: 0 0 0 3px rgba(185,154,118,0.12);
}
.option small {
  display: block;
  color: var(--text-sub);
  font-size: 12px;
  margin-top: 4px;
}
.option.q-opt {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
}
.q-opt .opt-img {
  width: 68px;
  height: 68px;
  object-fit: cover;
  border-radius: 10px;
  flex: none;
  display: block;
}
.q-opt .opt-text { flex: 1; line-height: 1.5; }

/* ジャンル選択の2カラム */
.genre-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.genre-grid .option {
  margin-bottom: 0;
  text-align: center;
  padding: 0 0 16px 0;
  overflow: hidden;
}
.genre-img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  display: block;
  margin-bottom: 12px;
  background: var(--surface-soft);
}
.genre-grid .option .genre-name { font-weight: 600; font-size: 15px; display: block; }
.genre-grid .option .genre-en {
  display: block;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--text-sub);
  margin-top: 4px;
  font-weight: 400;
}

/* ボタン */
.btn {
  display: inline-block;
  width: 100%;
  padding: 14px 20px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  min-height: 48px;
  transition: opacity .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
  font-family: inherit;
}
.btn:hover { opacity: 0.9; }
.btn:disabled { background: #CFC7BB; cursor: not-allowed; }
.btn.ghost {
  background: #fff;
  color: var(--text-sub);
  border: 1px solid var(--border);
}
@media (hover: hover) {
  .btn.ghost:hover { background: var(--accent); color: #fff; border-color: var(--accent); opacity: 1; }
}
.btn.ghost:active { background: var(--accent); color: #fff; border-color: var(--accent); }
.more-price { display: flex; align-items: center; gap: 16px; margin: 36px 4px 10px; color: var(--text-sub); }
.more-price::before, .more-price::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.more-price span { font-size: 13px; letter-spacing: .12em; white-space: nowrap; }
.more-price-arrow { text-align: center; color: var(--accent); margin: 0 0 4px; animation: mpBounce 1.6s ease-in-out infinite; }
.more-price-arrow svg { display: inline-block; }
@keyframes mpBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { .more-price-arrow { animation: none; } }

/* 進捗表示 */
.progress {
  display: flex;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 6px;
}
.progress .dot {
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: var(--border);
}
.progress .dot.active { background: var(--accent); }

/* チェックボックス（追加オプション） */
.check-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all .15s ease;
  background: var(--surface);
}
.check-item:hover { border-color: var(--accent); }
.check-item.checked {
  border-color: var(--accent);
  background: var(--surface-soft);
}
.check-item input[type="checkbox"] {
  appearance: none; -webkit-appearance: none;
  width: 20px; height: 20px;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  background: #fff;
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  transition: background .15s ease, border-color .15s ease;
}
.check-item input[type="checkbox"]:checked {
  background: var(--accent);
  border-color: var(--accent);
}
.check-item input[type="checkbox"]:checked::after {
  content: "";
  position: absolute;
  left: 6px; top: 2px;
  width: 5px; height: 10px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.check-item .label { flex: 1; font-size: 14px; }
.check-item .price { font-size: 13px; color: var(--accent); font-weight: 600; white-space: nowrap; }
.check-item.disabled { opacity: 0.4; cursor: not-allowed; }

/* 郵便番号入力 */
.zip-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.zip-row input {
  flex: 1;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  min-height: 48px;
  font-family: inherit;
  color: var(--text);
  background: #fff;
}
.zip-row input:focus { outline: none; border-color: var(--accent); }
.zip-row button {
  padding: 0 18px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  min-height: 48px;
  font-family: inherit;
}
.zip-result {
  font-size: 13px;
  color: var(--text-sub);
  padding: 10px 12px;
  background: var(--surface-soft);
  border-radius: 10px;
  margin-top: 8px;
}
.zip-manual {
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-sub);
}
.zip-manual select {
  width: 100%;
  padding: 12px 14px;
  margin-top: 6px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  min-height: 48px;
  font-family: inherit;
  color: var(--text);
  background: #fff;
}

/* 診断結果カード */
.result-plan {
  background: linear-gradient(135deg, var(--surface-soft), var(--pink-soft));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 20px;
  text-align: center;
  margin-bottom: 20px;
}
.result-plan .tag {
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 8px;
}
.result-plan .plan-name {
  font-family: var(--serif);
  font-size: 23px;
  font-weight: 700;
  margin: 0 0 12px;
  color: var(--text);
}
.result-plan .plan-desc {
  font-size: 13px;
  color: var(--text);
  white-space: pre-line;
  margin-bottom: 14px;
  line-height: 1.7;
}
.result-plan .plan-price {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.result-plan .plan-price small {
  font-size: 12px;
  color: var(--text-sub);
  font-weight: 500;
  margin-right: 6px;
}

/* プラン写真と附属情報 */
.start-photo {
  display: block;
  width: 100%;
  height: 240px;
  object-fit: cover;
  border-radius: var(--radius);
  margin-bottom: 20px;
}
.start-card {
  text-align: center;
}
.plan-photo {
  display: block;
  width: 100%;
  border-radius: 12px;
  margin: 14px 0 8px;
  background: var(--surface-soft);
}
.plan-subtitle {
  font-size: 13px;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 14px;
  white-space: pre-line;
}
.plan-features {
  text-align: left;
  margin: 14px 0 0;
  padding: 14px 0 0 20px;
  border-top: 1px dashed var(--border);
  font-size: 13px;
  color: var(--text);
  line-height: 1.7;
}
.plan-features li { margin-bottom: 6px; }
.plan-features li:last-child { margin-bottom: 0; }
.reco-badge {
  display: inline-block;
  vertical-align: middle;
  margin-left: 8px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  letter-spacing: 0.1em;
  font-weight: 600;
}
.goods-note {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid var(--pink-soft);
  border-radius: 10px;
  font-size: 12px;
  color: var(--text);
  line-height: 1.6;
  background: rgba(244, 231, 225, 0.35);
}
.goods-note strong { font-size: 14px; color: var(--accent); }

/* 最終まとめ表示 */
.summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 20px;
  box-shadow: var(--shadow);
}
.summary .summary-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 14px;
  gap: 12px;
}
.summary .summary-row:last-of-type { border-bottom: none; }
.summary .summary-row .label { color: var(--text-sub); flex-shrink: 0; }
.summary .summary-row .value { text-align: right; }
.summary .total {
  margin-top: 14px;
  padding: 18px 16px;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.summary .total .total-label { font-size: 14px; }
.summary .total .total-value { font-size: 22px; font-weight: 700; }
.summary .note {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 12px;
  line-height: 1.6;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 12px);
  background: var(--text);
  color: #fff;
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 100;
  max-width: 90vw;
  text-align: center;
  box-shadow: var(--shadow);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ラジオ風（アニバーサリー撮影内容・納品枚数） */
.radio-group { display: grid; gap: 10px; }
.radio-item {
  display: block;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  background: var(--surface);
  transition: all .15s ease;
}
.radio-item:hover { border-color: var(--accent); }
.radio-item.selected { border-color: var(--accent); background: var(--surface-soft); }
.radio-item .r-title { font-weight: 600; font-size: 15px; }
.radio-item .r-desc { font-size: 12px; color: var(--text-sub); margin-top: 4px; line-height: 1.6; }
.radio-item .r-price { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 6px; }

/* ステップ切り替え */
.step { display: none; }
.step.active { display: block; animation: fade .25s ease; }
@keyframes fade {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ナビゲーションボタン列 */
.nav-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.nav-row .btn { flex: 1; white-space: nowrap; padding-left: 12px; padding-right: 12px; }
@media (max-width: 400px) { .nav-row .btn { font-size: 13.5px; padding-left: 8px; padding-right: 8px; } }

/* レスポンシブ調整 */
@media (max-width: 380px) {
  .header h1 { font-size: 18px; }
  .card { padding: 16px; }
  .result-plan .plan-name { font-size: 20px; }
}
</style>
</head>

/* =========================================================
   アニバーサリー 料金表
   ========================================================= */
function goStep(id) {
  document.querySelectorAll(".step").forEach(el => el.classList.remove("active"));
  const target = document.getElementById(id);
  if (target) target.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =========================================================
   ジャンル選択
   ========================================================= */
function renderNbQuestion() {
  const i = state.nbCurrentQ;
  const q = nbQuestions[i];
  document.getElementById("nb-question-title").textContent = q.q;
  document.getElementById("nb-back").style.visibility = i === 0 ? "hidden" : "visible";

  // 進捗
  const prog = document.getElementById("nb-progress");
  prog.innerHTML = "";
  for (let n = 0; n < nbQuestions.length; n++) {
    const dot = document.createElement("div");
    dot.className = "dot" + (n <= i ? " active" : "");
    prog.appendChild(dot);
  }

  // 選択肢
  const answersDiv = document.getElementById("nb-answers");
  answersDiv.innerHTML = "";
  q.a.forEach(opt => {
    const b = document.createElement("button");
    b.className = "option" + (opt.img ? " q-opt" : "");
    if (state.nbAnswers[i] === opt.key) b.classList.add("selected");
    if (opt.img) {
      b.innerHTML = '<img class="opt-img" src="' + opt.img + '" alt=""><span class="opt-text">' + opt.text + '</span>';
    } else {
      b.textContent = opt.text;
    }
    b.addEventListener("click", () => {
      state.nbAnswers[i] = opt.key;
      // 次の質問へ or 結果へ
      if (i < nbQuestions.length - 1) {
        state.nbCurrentQ = i + 1;
        renderNbQuestion();
      } else {
        state.nbPlan = judgeNbPlan(state.nbAnswers);
        renderNbResult();
        renderSummary();
        goStep("step-newborn-result");
      }
    });
    answersDiv.appendChild(b);
  });
}

// 戻るボタン
document.getElementById("nb-back").addEventListener("click", () => {
  if (state.nbCurrentQ > 0) {
    state.nbCurrentQ--;
    renderNbQuestion();
  }
});

/* =========================================================
   ニューボーン判定ロジック
   - A/B/Cを集計
   - Aが最多 → mini
   - Bが最多 → standard
   - Cが最多 → special
   - 同数の場合は上位のプランを優先
     A=B → standard、B=C → special、A=C → special
   ========================================================= */

function judgeNbPlan(answers) {
  const count = { A: 0, B: 0, C: 0 };
  answers.forEach(k => count[k]++);
  const max = Math.max(count.A, count.B, count.C);
  const winners = [];
  if (count.A === max) winners.push("A");
  if (count.B === max) winners.push("B");
  if (count.C === max) winners.push("C");

  // 同数の場合はより上位のプランを優先（C > B > A）
  if (winners.includes("C")) return "special";
  if (winners.includes("B")) return "standard";
  return "mini";
}

/* =========================================================
   ニューボーン結果表示
   ========================================================= */
function renderNbResult() {
  const p = nbPlans[state.nbPlan];
  const box = document.getElementById("nb-result");
  const featureList = p.features.map(f => `<li>${f}</li>`).join("");
  const goodsHtml = p.goodsMin
    ? `<div class="goods-note">撮影当日フォトグッズ ${p.goodsMin.toLocaleString()}円以上の追加購入で<br><strong>${p.goodsDiscount.toLocaleString()}円引き</strong></div>`
    : "";
  const recoBadge = p.recommended ? `<span class="reco-badge">おすすめ</span>` : "";
  box.innerHTML = `
    <div class="tag">あなたにおすすめなのは</div>
    <div class="plan-name">${p.name}${recoBadge}</div>
    <img src="${p.image}" alt="${p.name}" class="plan-photo" />
    <div class="plan-subtitle">${p.subtitle}</div>
    <div class="plan-price"><small>基本料金</small>${p.price.toLocaleString()}円</div>
    <ul class="plan-features">${featureList}</ul>
    ${goodsHtml}
  `;
  document.querySelectorAll("#step-newborn-result input[type=checkbox]").forEach(c => c.checked = false);
  document.querySelectorAll("#step-newborn-result .check-item").forEach(c => c.classList.remove("checked"));
  state.nbOptions = {};

  // スペシャルプランは生花がプラン内（加算なし・「プラン内」と表示）
  const isSpecial = state.nbPlan === "special";
  document.querySelectorAll('#step-newborn-result .check-item input[data-group="nb-flower"]').forEach(function (cb) {
    const item = cb.closest(".check-item");
    const priceEl = item.querySelector(".price");
    if (cb.dataset.origPrice === undefined) cb.dataset.origPrice = cb.dataset.price;
    if (priceEl.dataset.orig === undefined) priceEl.dataset.orig = priceEl.textContent;
    if (isSpecial) { cb.dataset.price = "0"; priceEl.textContent = "プラン内"; }
    else { cb.dataset.price = cb.dataset.origPrice; priceEl.textContent = priceEl.dataset.orig; }
  });
}

/* =========================================================
   他のプランを見る
   ========================================================= */
function restartNbQuiz() {
  state.nbAnswers = [];
  state.nbCurrentQ = 0;
  renderNbQuestion();
  goStep("step-newborn-quiz");
}

function renderAllPlans() {
  const list = document.getElementById("all-plans-list");
  list.innerHTML = Object.keys(nbPlans).map(key => {
    const p = nbPlans[key];
    const badge = p.recommended ? ' <span class="reco-badge">おすすめ</span>' : "";
    return `
      <div class="radio-item" tabindex="0" role="button"
           style="display:flex;gap:12px;align-items:center;"
           onclick="selectPlan('${key}')"
           onkeydown="if(event.key==='Enter')selectPlan('${key}')">
        <img src="${p.image}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:10px;flex-shrink:0;" />
        <div style="flex:1;">
          <div class="r-title">${p.name}${badge}</div>
          <div class="r-desc">${p.subtitle}</div>
          <div class="r-price">${p.price.toLocaleString()}円</div>
        </div>
      </div>
    `;
  }).join("");
}

function selectPlan(key) {
  state.nbPlan = key;
  renderNbResult();
  renderSummary();
  goStep("step-newborn-result");
}

/* =========================================================
   チェックボックス（追加オプション）ハンドラ
   - 「プチ生花」と「生花たっぷり」の排他制御を含む
   ========================================================= */
document.querySelectorAll(".check-item").forEach(item => {
  const input = item.querySelector("input[type=checkbox]");
  input.addEventListener("change", () => {
    // グループ排他（生花系は片方だけ）
    const group = input.dataset.group;
    if (group && input.checked) {
      document.querySelectorAll(`input[data-group="${group}"]`).forEach(other => {
        if (other !== input) {
          other.checked = false;
          other.closest(".check-item").classList.remove("checked");
        }
      });
    }
    // 見た目
    if (input.checked) item.classList.add("checked");
    else item.classList.remove("checked");
    // 見積りをその場で更新
    renderSummary();
  });
});

// 2点間の距離をkmで計算（ハーサイン公式）
function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 距離から交通費を返す
function feeFromDistance(km) {
  if (km <= 5) return 0;
  if (km <= 10) return 1000;
  if (km <= 20) return 2000;
  if (km <= 30) return 3000;
  if (km <= 40) return 4000;
  if (km <= 50) return 5000;
  return 5000; // 50km以上は要相談扱い、暫定5,000円
}

// HTMLへ挿入する前に最低限のエスケープを行う
function escZip(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// タイムアウト付きfetch（通信環境が悪い場合に長時間待たされないように）
function fetchWithTimeout(url, ms = 8000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
}

async function calcTravel() {
  const raw = document.getElementById("zip").value.replace(/[^0-9]/g, "");
  const resultBox = document.getElementById("zip-result");
  const btn = document.getElementById("zip-calc-btn");
  resultBox.style.display = "block";

  if (raw.length !== 7) {
    resultBox.innerHTML = "郵便番号は7桁の数字で入力してください（例：8300033）";
    return;
  }

  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>計算中';
  resultBox.innerHTML = '<span class="spinner" style="border-top-color:var(--accent);border-color:rgba(185,154,118,.25);"></span>郵便番号から距離を計算しています…';

  try {
    // 1) 郵便番号 → 住所（日本郵便のデータベースをもとにしたZipCloud API）
    const zipRes = await fetchWithTimeout(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${raw}`);
    const zipData = await zipRes.json();
    if (!zipData.results || !zipData.results.length) throw new Error("zip-not-found");
    const r = zipData.results[0];
    const address = `${r.address1}${r.address2}${r.address3}`;

    // 2) 住所 → 緯度経度（OpenStreetMap Nominatim）
    const geoRes = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=jp&limit=1&q=${encodeURIComponent("日本 " + address)}`);
    const geoData = await geoRes.json();
    if (!geoData.length) throw new Error("geocode-not-found");

    const lat = parseFloat(geoData[0].lat);
    const lng = parseFloat(geoData[0].lon);
    const km = distanceKm(NISHITETSU_KURUME.lat, NISHITETSU_KURUME.lng, lat, lng);
    const fee = feeFromDistance(km);
    const kmRounded = Math.round(km * 10) / 10;

    state.travel = {
      distanceLabel: `西鉄久留米駅から約${kmRounded}km（${address}）`,
      price: fee
    };
    resultBox.innerHTML = `
      <strong>${escZip(address)}</strong>と算出<br>
      西鉄久留米駅から約 <strong>${kmRounded}km</strong><br>
      交通費：<strong>${fee === 0 ? "無料" : "＋" + fee.toLocaleString() + "円"}</strong><br>
      <span style="font-size:11px;">※高速料金・駐車場代・施設使用料が必要な場合は別途必要となります</span>
    `;
  } catch (e) {
    // オンライン計算に失敗した場合：郵便番号の頭3桁によるオフライン概算にフォールバック
    const prefix = raw.substring(0, 3);
    const area = areaCoords[prefix];

    if (area) {
      const km = distanceKm(NISHITETSU_KURUME.lat, NISHITETSU_KURUME.lng, area.lat, area.lng);
      const fee = feeFromDistance(km);
      const kmRounded = Math.round(km);
      state.travel = {
        distanceLabel: `西鉄久留米駅から約${kmRounded}km（${area.name}周辺・概算）`,
        price: fee
      };
      resultBox.innerHTML = `
        <span style="font-size:11px;color:var(--text-sub);">※通信環境により郵便番号の頭3桁からの概算です</span><br>
        <strong>${escZip(area.name)}周辺</strong>と推定・西鉄久留米駅から約 <strong>${kmRounded}km</strong><br>
        交通費：<strong>${fee === 0 ? "無料" : "＋" + fee.toLocaleString() + "円"}</strong><br>
        <span style="font-size:11px;">※高速料金・駐車場代・施設使用料が必要な場合は別途必要となります</span>
      `;
    } else {
      resultBox.innerHTML = `
        郵便番号から距離を算出できませんでした。<br>
        恐れ入りますが、下の「距離を選択」から目安を選んでください。
      `;
      state.travel = { distanceLabel: null, price: 0 };
    }
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
    renderSummary();
  }
}

function applyManualDistance() {
  const sel = document.getElementById("manual-distance");
  const val = sel.value;
  if (val === "") return;
  const price = parseInt(val, 10);
  const label = sel.options[sel.selectedIndex].text;
  state.travel = {
    distanceLabel: `目安：${label}`,
    price: price
  };
  const resultBox = document.getElementById("zip-result");
  resultBox.style.display = "block";
  resultBox.innerHTML = `
    ${label} を選択<br>
    交通費：<strong>${price === 0 ? "無料" : "＋" + price.toLocaleString() + "円"}</strong><br>
    <span style="font-size:11px;">※高速料金・駐車場代・施設使用料が必要な場合は別途必要となります</span>
  `;
  renderSummary();
}

/* 交通費画面の「戻る」ボタン */
var _tb = document.getElementById("travel-back");
if (_tb) _tb.addEventListener("click", () => { goStep("step-newborn-result"); });

/* =========================================================
   最終まとめ表示
   ========================================================= */

function renderSummary() {
  const box = document.getElementById("summary-box");
  if (!box || !state.nbPlan) return;
  const rows = [];
  let total = 0;

  const p = nbPlans[state.nbPlan];
  rows.push({ label: "撮影ジャンル", value: "ニューボーンフォト" });
  rows.push({ label: "おすすめプラン", value: `${p.name}<br><strong>${p.price.toLocaleString()}円</strong>` });
  total += p.price;

  // 追加オプション
  const opts = [];
  document.querySelectorAll("#step-newborn-result .check-item input:checked").forEach(cb => {
    const item = cb.closest(".check-item");
    const label = item.querySelector(".label").textContent;
    const price = parseInt(cb.dataset.price, 10);
    opts.push({ label, price });
    total += price;
  });
  if (opts.length) {
    const optHtml = opts.map(o => `${o.label}　<strong>${o.price === 0 ? "プラン内" : (o.price >= 0 ? "＋" : "−") + Math.abs(o.price).toLocaleString() + "円"}</strong>`).join("<br>");
    rows.push({ label: "追加オプション", value: optHtml });
  }

  // 交通費
  if (state.travel.distanceLabel) {
    rows.push({
      label: "交通費",
      value: `${state.travel.distanceLabel}<br><strong>${state.travel.price === 0 ? "無料" : "＋" + state.travel.price.toLocaleString() + "円"}</strong>`
    });
    total += state.travel.price;
  }

  lastSummaryRows = rows;
  lastSummaryTotal = total;

  // HTML生成
  const rowsHtml = rows.map(r => `
    <div class="summary-row">
      <span class="label">${r.label}</span>
      <span class="value">${r.value}</span>
    </div>
  `).join("");

  const noteHtml = "※正式なお見積りは、撮影内容とご住所を確認後にご案内します。";

  box.innerHTML = `
    ${rowsHtml}
    <div class="total">
      <span class="total-label">合計目安</span>
      <span class="total-value">${total.toLocaleString()}円</span>
    </div>
    <div class="note">${noteHtml}</div>
  `;
}


// HTMLタグを簡易的にプレーンテキストへ変換（<br>は区切り、他のタグは除去）
function htmlToPlainLine(html) {
  return String(html)
    .replace(/<br\s*\/?>/gi, " / ")
    .replace(/<\/?[^>]+(>|$)/g, "")
    .trim();
}

function buildReservationText() {
  const lines = ["【撮影プラン診断】ご予約のご相談", ""];
  lastSummaryRows.forEach(r => {
    lines.push(`【${r.label}】${htmlToPlainLine(r.value)}`);
  });
  lines.push("");
  lines.push(`【合計目安】${lastSummaryTotal.toLocaleString()}円`);
  lines.push("");
  lines.push("上記の内容でご予約を相談したいです。よろしくお願いいたします。");
  return lines.join("\n");
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => toast.classList.remove("show"), 3200);
}

document.getElementById("reserve-btn").addEventListener("click", () => {
  const text = buildReservationText();
  // クリップボードへもコピー（ブラウザでの保険）
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {});
  }

  // LINEの深堀リンクでメッセージを事前入力して開く（ユーザーは送信するだけ）
  const lineMsgUrl = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
  // まずトーストで通知、その後LINEを開く
  showToast("LINEを開きました。メッセージが入力済みです。送信してください。");
  window.open(lineMsgUrl, "_blank");
});

function resetAll() {
  state.nbAnswers = [];
  state.nbCurrentQ = 0;
  state.nbPlan = null;
  state.travel = { distanceLabel: null, price: 0 };

  // UIリセット
  document.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = false);
  document.querySelectorAll(".check-item").forEach(c => c.classList.remove("checked"));
  document.getElementById("zip").value = "";
  document.getElementById("manual-distance").value = "";
  document.getElementById("zip-result").style.display = "none";
  document.getElementById("zip-calc-btn").disabled = false;
  document.getElementById("zip-calc-btn").textContent = "計算";

  renderNbQuestion();
  goStep("step-newborn-quiz");
}

document.getElementById("start-btn").addEventListener("click", () => {
  renderNbQuestion();
  goStep("step-newborn-quiz");
});
</script>
